{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>
<form method="post" class="w-100" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
</form>
<p>
  <a href="{% url 'core:login' %}">Уже есть аккаунт? Войти</a>
</p>
{% endblock %}
